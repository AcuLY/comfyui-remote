<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审核队列 - ComfyUI Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system.css">
  <style>
    .page-header {
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .stats-grid {
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
      /* 桌面端：4列 */
      grid-template-columns: repeat(4, 1fr);
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: all var(--transition-base) var(--ease);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-primary);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .stat-value.accent {
      color: var(--accent-primary);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .queue-item {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      cursor: pointer;
      transition: all var(--transition-base) var(--ease);
      text-decoration: none;
      display: block;
    }

    .queue-item:hover {
      transform: translateY(-2px);
      border-color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 16px;
      gap: 16px;
    }

    .queue-info h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .queue-meta {
      font-size: 13px;
      color: var(--text-tertiary);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .queue-badge {
      padding: 6px 12px;
      background: var(--accent-primary-light);
      color: var(--accent-primary);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .queue-badge.pending {
      background: var(--accent-secondary-light);
      color: var(--accent-secondary);
    }

    .thumbnail-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: thin;
    }

    .thumbnail-strip::-webkit-scrollbar {
      height: 4px;
    }

    .thumbnail-strip::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 2px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: var(--text-tertiary);
      border-radius: 2px;
    }

    .thumbnail {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent-primary-light), var(--accent-secondary-light));
      border-radius: 8px;
      flex-shrink: 0;
      transition: all var(--transition-base) var(--ease);
      border: 1px solid var(--border-primary);
    }

    .thumbnail:hover {
      transform: scale(1.05);
    }

    /* 平板：2列统计卡片 */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 移动端：2列统计卡片，队列项垂直布局 */
    @media (max-width: 640px) {
      .page-title {
        font-size: 24px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .queue-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .queue-badge {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; padding: 16px 0;">
      <div style="font-size: 18px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em;">ComfyUI Manager</div>
      <button class="theme-toggle" id="theme-toggle" aria-label="切换主题" style="width: 40px; height: 40px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;">
        <svg class="sun-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--text-primary);">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg class="moon-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--text-primary); display: none;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </header>

    <div class="page-header">
      <h1 class="page-title">审核队列</h1>
      <p class="page-subtitle">点击任意运行组进入宫格审图模式</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">待审核</div>
        <div class="stat-value accent">18</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总运行数</div>
        <div class="stat-value">247</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">今日生成</div>
        <div class="stat-value">42</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">完成率</div>
        <div class="stat-value">92%</div>
      </div>
    </div>

    <div class="queue-list">
      <a href="/queue/1" class="queue-item">
        <div class="queue-header">
          <div class="queue-info">
            <h3>角色立绘 - 幻想风格 / 小节 1</h3>
            <div class="queue-meta">
              <span>2小时前</span>
              <span>•</span>
              <span>SDXL</span>
              <span>•</span>
              <span>HiRes Fix 2x</span>
            </div>
          </div>
          <div class="queue-badge pending">待审核 12 张</div>
        </div>
        <div class="thumbnail-strip">
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
        </div>
      </a>

      <a href="/queue/2" class="queue-item">
        <div class="queue-header">
          <div class="queue-info">
            <h3>场景概念设计 / 小节 3</h3>
            <div class="queue-meta">
              <span>5小时前</span>
              <span>•</span>
              <span>自定义模板</span>
              <span>•</span>
              <span>1024x1024</span>
            </div>
          </div>
          <div class="queue-badge pending">待审核 8 张</div>
        </div>
        <div class="thumbnail-strip">
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
        </div>
      </a>

      <a href="/queue/3" class="queue-item">
        <div class="queue-header">
          <div class="queue-info">
            <h3>产品渲染测试 / 小节 2</h3>
            <div class="queue-meta">
              <span>1天前</span>
              <span>•</span>
              <span>SDXL</span>
              <span>•</span>
              <span>16:9</span>
            </div>
          </div>
          <div class="queue-badge">已完成</div>
        </div>
        <div class="thumbnail-strip">
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
        </div>
      </a>

      <a href="/queue/4" class="queue-item">
        <div class="queue-header">
          <div class="queue-info">
            <h3>风格实验 - 水彩 / 小节 1</h3>
            <div class="queue-meta">
              <span>3天前</span>
              <span>•</span>
              <span>SDXL</span>
              <span>•</span>
              <span>1:1</span>
            </div>
          </div>
          <div class="queue-badge">已完成</div>
        </div>
        <div class="thumbnail-strip">
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
          <div class="thumbnail"></div>
        </div>
      </a>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme') || 'light';
    html.setAttribute('data-theme', savedTheme);

    const sunIcon = document.querySelector('.sun-icon');
    const moonIcon = document.querySelector('.moon-icon');

    function updateIcons() {
      const theme = html.getAttribute('data-theme');
      if (theme === 'dark') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    updateIcons();

    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcons();
    });
  </script>
</body>
</html>
