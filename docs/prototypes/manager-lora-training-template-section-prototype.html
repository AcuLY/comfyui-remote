<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 模板小节</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260614-prototype-alignment-2" />
  </head>
  <body>
    <a class="skip-link" href="#prototype-main">跳到主要内容</a>
    <main class="app-shell" id="prototype-main">
      <div class="page">
        <header class="topbar">
          <div class="title-stack"><a class="back-link" href="./manager-lora-training-template-edit-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回模板</a><div class="title-row"><h1>舞台肖像</h1><span class="status-note green">启用</span><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span></div></div>
          <div class="topbar-actions"><button class="button primary" type="button">保存小节</button></div>
        </header>
        <section class="layout wide-left">
          <section class="panel">
            <div class="panel-header"><h2>模板场景块</h2><div class="panel-actions"><button class="button" type="button"><i data-lucide="layers" aria-hidden="true"></i>添加预制块</button><button class="button primary" type="button"><i data-lucide="plus" aria-hidden="true"></i>新增本地块</button></div></div>
            <div class="panel-body block-list">
              <div class="block-item"><span class="block-index">1</span><div class="row-title"><strong>光线 / 青色轮廓光</strong><span>来自预制 · 强青色轮廓光</span></div><span class="status-note blue">预制</span><div class="block-actions"><button class="button block-edit-action" type="button"><i data-lucide="replace" aria-hidden="true"></i>编辑绑定</button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除场景块"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div>
              <div class="block-item"><span class="block-index">2</span><div class="row-title"><strong>本地补充</strong><span>干净的人像裁切，正面站姿，自信直视镜头</span></div><span class="status-note">本地</span><div class="block-actions"><button class="button block-edit-action" type="button"><i data-lucide="pencil" aria-hidden="true"></i>编辑文本</button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除场景块"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div>
              <div class="resolved-scene-row"><div class="row-title"><strong>合成场景描述</strong><span>强青色轮廓光，干净的人像裁切，正面站姿，自信直视镜头。</span></div><button class="button primary" type="button"><i data-lucide="save" aria-hidden="true"></i>保存小节</button></div>
            </div>
          </section>
          <aside class="panel"><div class="panel-header"><h2>小节默认值</h2></div><div class="panel-body compact-kv"><div><span>排序</span><span>1</span></div><div><span>状态</span><span>启用</span></div><div><span>图片尺寸</span><span>1024 × 1536</span></div><div><span>质量</span><span>高</span></div></div></aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260614-prototype-alignment-2"></script>
    <script>initLoraPrototype("templates");</script>
  </body>
</html>
