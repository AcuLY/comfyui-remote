<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 预制详情</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260614-prototype-alignment-2" />
  </head>
  <body>
    <a class="skip-link" href="#prototype-main">跳到主要内容</a>
    <main class="app-shell" id="prototype-main">
      <div class="page">
        <header class="topbar">
          <div class="title-stack">
            <a class="back-link" href="./manager-lora-training-presets-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i>返回预制</a>
            <div class="title-row"><h1>青色轮廓光</h1><span class="status-note green">启用</span><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i>LoRA 训练</span></div>
          </div>
          <div class="topbar-actions"><button class="button red" type="button"><i data-lucide="trash-2" aria-hidden="true"></i>删除</button><button class="button primary" type="button">保存预制</button></div>
        </header>
        <section class="layout wide-left">
          <div class="stack">
            <section class="panel">
              <div class="panel-header"><h2>预制内容</h2></div>
              <div class="panel-body form-grid">
                <div class="field"><label>名称</label><input class="input" name="preset_name" aria-label="预制名称" autocomplete="off" value="青色轮廓光" /></div>
                <div class="field"><label>分类</label><input class="input" name="preset_category" aria-label="预制分类" autocomplete="off" value="光线" /></div>
                <div class="field"><label>文件夹</label><input class="input" name="preset_folder" aria-label="预制文件夹" autocomplete="off" value="舞台" /></div>
                <div class="field full"><label>场景描述正文</label><textarea class="textarea" name="scene_description_text" aria-label="场景描述正文" autocomplete="off" spellcheck="false">强烈的青色轮廓光，轻微舞台雾气，人物剪影干净，构图偏杂志人像。</textarea></div>
                <div class="field full"><label>备注</label><textarea class="textarea" name="preset_notes" aria-label="预制备注" autocomplete="off">用于舞台和人像小节，需要稳定的青色轮廓光时直接复用。</textarea></div>
              </div>
            </section>
          </div>
          <aside class="stack">
            <section class="panel">
              <div class="panel-header"><h2>使用情况</h2></div>
              <div class="panel-body compact-kv">
                <div><span>项目引用</span><span>7</span></div>
                <div><span>模板引用</span><span>3</span></div>
                <div><span>状态</span><span>启用</span></div>
                <div><span>最近更新</span><span>16:12</span></div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-header"><h2>引用</h2></div>
              <div class="panel-body entity-list">
                <a class="entity-row" href="./manager-lora-training-project-section-detail-prototype.html"><div class="row-title"><strong>Vela Neon Jacket / 舞台灯光</strong><span>项目小节里的场景块</span></div><i data-lucide="chevron-right" aria-hidden="true"></i></a>
                <a class="entity-row" href="./manager-lora-training-template-section-prototype.html"><div class="row-title"><strong>角色 LoRA 基础模板 / 舞台肖像</strong><span>模板小节里的场景块</span></div><i data-lucide="chevron-right" aria-hidden="true"></i></a>
              </div>
            </section>
            <section class="panel">
              <div class="panel-header"><h2>删除影响</h2></div>
              <div class="panel-body stack">
                <div class="row-title">
                  <strong>删除前先确认引用</strong>
                  <span>当前预制仍被 7 个项目场景块和 3 个模板场景块使用。</span>
                </div>
                <div class="compact-kv">
                  <div><span>项目侧处理</span><span>从可变场景块里移除引用</span></div>
                  <div><span>模板侧处理</span><span>从模板场景块里移除引用</span></div>
                  <div><span>历史快照</span><span>已生成的运行与数据集快照不回写</span></div>
                  <div><span>删除方式</span><span>停用并从新选择列表中隐藏</span></div>
                </div>
                <div class="action-strip">
                  <button class="button" type="button"><i data-lucide="list-tree" aria-hidden="true"></i>查看全部受影响引用</button>
                  <button class="button red" type="button"><i data-lucide="trash-2" aria-hidden="true"></i>确认删除并移除引用</button>
                </div>
              </div>
            </section>
          </aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260614-prototype-alignment-2"></script>
    <script>initLoraPrototype("presets");</script>
  </body>
</html>
