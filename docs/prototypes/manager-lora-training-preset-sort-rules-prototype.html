<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 预制排序规则</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260614-prototype-alignment-2" />
  </head>
  <body>
    <a class="skip-link" href="#prototype-main">跳到主要内容</a>
    <main class="app-shell" id="prototype-main">
      <div class="page">
        <header class="topbar">
          <div class="title-stack"><a class="back-link" href="./manager-lora-training-presets-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回预制</a><div class="title-row"><h1>排序规则</h1><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span></div></div>
          <div class="topbar-actions"><button class="button primary" type="button">保存排序</button></div>
        </header>
        <section class="layout">
          <section class="panel">
            <div class="panel-header"><h2>场景分类顺序</h2></div>
            <div class="panel-body block-list">
              <div class="block-item"><span class="block-index">10</span><div class="row-title"><strong>光线</strong><span>合成顺序</span></div><span class="chip blue">18 个预制</span></div>
              <div class="block-item"><span class="block-index">20</span><div class="row-title"><strong>环境</strong><span>合成顺序</span></div><span class="chip">24 个预制</span></div>
              <div class="block-item"><span class="block-index">30</span><div class="row-title"><strong>姿态</strong><span>合成顺序</span></div><span class="chip">12 个预制</span></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>光线分类内预制顺序</h2></div>
            <div class="panel-body block-list">
              <div class="block-item"><span class="block-index">1</span><div class="row-title"><strong>青色轮廓光</strong><span>分类内顺序</span></div><button class="icon-button" type="button" aria-label="调整青色轮廓光的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></div>
              <div class="block-item"><span class="block-index">2</span><div class="row-title"><strong>柔和窗侧光</strong><span>分类内顺序</span></div><button class="icon-button" type="button" aria-label="调整柔和窗侧光的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></div>
              <div class="block-item"><span class="block-index">3</span><div class="row-title"><strong>夜景逆光</strong><span>分类内顺序</span></div><button class="icon-button" type="button" aria-label="调整夜景逆光的顺序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button></div>
            </div>
          </section>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260614-prototype-alignment-2"></script>
    <script>initLoraPrototype("presets");</script>
  </body>
</html>
