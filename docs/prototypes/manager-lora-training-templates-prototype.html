    <title>LoRA 训练模式 - 模板原型</title>

  <body>
    <main class="app-shell">
      <div class="page">
        <header class="topbar">
          <div class="title-row"><h1>模板</h1><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i>LoRA 训练</span></div>
          <div class="topbar-actions"><a class="button primary" href="./manager-lora-training-template-new-prototype.html"><i data-lucide="plus" aria-hidden="true"></i>新建</a></div>
        </header>
        <section class="grid-2">
          <a class="card" href="./manager-lora-training-template-edit-prototype.html">
            <div class="row-head"><div class="row-title"><strong>角色 LoRA 基础模板</strong><span>6 个小节 · sortOrder 1</span></div><span class="status-note green">启用</span></div>

          </a>
        </section>
      </div>
