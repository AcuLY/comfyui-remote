<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 新建模板原型</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260611-lora-template-new-1" />
  </head>
  <body>
    <main class="app-shell">
      <div class="page">
        <header class="topbar">
          <div class="title-stack"><a class="back-link" href="./manager-lora-training-templates-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回模板</a><div class="title-row"><h1>新建模板</h1><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span></div></div>
          <div class="topbar-actions"><button class="button primary" type="button">创建模板</button></div>
        </header>
        <section class="layout wide-left">
          <div class="stack">
            <section class="panel"><div class="panel-header"><h2>基础</h2></div><div class="panel-body form-grid"><div class="field"><label>名称</label><input class="input" value="新角色 LoRA 模板" /></div><div class="field"><label>Slug</label><input class="input" value="new-character-lora" /></div><div class="field full"><label>描述</label><textarea class="textarea">Template seed for new LoRA training projects.</textarea></div></div></section>
            <section class="panel"><div class="panel-header"><h2>项目生成规则</h2></div><div class="panel-body form-grid"><div class="field full"><label>图片提示词指引</label><textarea class="textarea">Generate one clean training image for each request.</textarea></div><div class="field full"><label>Caption 指引</label><textarea class="textarea">Generate one concise caption per kept image.</textarea></div></div></section>
          </div>
          <aside class="panel"><div class="panel-header"><h2>初始小节</h2><button class="button" type="button"><i data-lucide="plus" aria-hidden="true"></i>添加小节</button></div><div class="panel-body block-list"><div class="block-item"><span class="block-index">1</span><div class="row-title"><strong>舞台肖像</strong><span>启用 · 2 个场景块</span></div><span class="status-note green">启用</span><div class="block-actions"><button class="icon-button" type="button" aria-label="编辑小节"><i data-lucide="pencil" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除小节"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div><div class="block-item"><span class="block-index">2</span><div class="row-title"><strong>棚拍肖像</strong><span>启用 · 1 个场景块</span></div><span class="status-note green">启用</span><div class="block-actions"><button class="icon-button" type="button" aria-label="编辑小节"><i data-lucide="pencil" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除小节"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div></div></aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260611-lora-rewrite-2"></script>
    <script>initLoraPrototype("templates");</script>
  </body>
</html>
