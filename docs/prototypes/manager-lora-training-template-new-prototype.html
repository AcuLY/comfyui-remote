<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 新建模板</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260614-prototype-alignment-2" />
  </head>
  <body>
    <a class="skip-link" href="#prototype-main">跳到主要内容</a>
    <main class="app-shell" id="prototype-main">
      <div class="page">
        <header class="topbar">
          <div class="title-stack"><a class="back-link" href="./manager-lora-training-templates-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回模板</a><div class="title-row"><h1>新建模板</h1><span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span></div><p class="small muted">先定义模板信息和默认规则，再添加初始小节。</p></div>
          <div class="topbar-actions"><button class="button primary" type="button">创建模板</button></div>
        </header>
        <section class="layout wide-left">
          <div class="stack">
            <section class="panel"><div class="panel-header"><h2>模板信息</h2></div><div class="panel-body form-grid"><div class="field full"><label>模板名称</label><input class="input" name="template_name" aria-label="模板名称" autocomplete="off" value="新角色 LoRA 模板" /></div><div class="field full"><label>描述</label><textarea class="textarea" name="template_description" aria-label="模板描述" autocomplete="off">用于新角色 LoRA 训练项目的起始模板，包含默认小节结构、提示词规则和训练参数。</textarea></div><div class="field full"><div class="list-row subtle"><div class="row-title"><strong>创建后行为</strong><span>模板只作为项目的起始种子使用；创建项目后，项目自己的规则、小节和预制绑定会独立维护。</span></div></div></div></div></section>
            <section class="panel"><div class="panel-header"><h2>项目生成规则</h2></div><div class="panel-body form-grid"><div class="field full"><label>图片提示词指引</label><textarea class="textarea" name="template_image_prompt_guidance" aria-label="图片提示词指引" autocomplete="off">每次请求只生成 1 张干净可训练的角色图片，优先保证角色身份稳定、轮廓清晰、背景可读。</textarea></div><div class="field full"><div class="plain-meta"><span>自动用于</span><span>训练集图片生成</span><span>参考图生成</span><span>项目内图片任务</span></div></div><div class="field full"><label>caption 生成指引</label><textarea class="textarea" name="template_captioning_guidance" aria-label="caption 生成指引" autocomplete="off">每张保留图片只生成 1 条简洁 caption，先写 LoRA 触发提示词，再补充姿态、服装、光线、镜头与背景。</textarea></div><div class="field full"><div class="plain-meta"><span>自动用于</span><span>批量 caption</span><span>数据集冻结快照</span><span>训练前检查</span></div></div></div></section>
          </div>
          <aside class="stack"><section class="panel"><div class="panel-header"><h2>初始小节</h2><button class="button" type="button"><i data-lucide="plus" aria-hidden="true"></i>添加小节</button></div><div class="panel-body block-list"><div class="block-item"><span class="block-index">1</span><div class="row-title"><strong>舞台肖像</strong><span>启用 · 2 个场景块</span></div><span class="status-note green">启用</span><div class="block-actions"><button class="icon-button" type="button" aria-label="编辑小节"><i data-lucide="pencil" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除小节"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div><div class="block-item"><span class="block-index">2</span><div class="row-title"><strong>棚拍肖像</strong><span>启用 · 1 个场景块</span></div><span class="status-note green">启用</span><div class="block-actions"><button class="icon-button" type="button" aria-label="编辑小节"><i data-lucide="pencil" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="调整排序"><i data-lucide="grip-vertical" aria-hidden="true"></i></button><button class="icon-button" type="button" aria-label="删除小节"><i data-lucide="trash-2" aria-hidden="true"></i></button></div></div></div></section><section class="panel"><div class="panel-header"><h2>默认训练参数</h2></div><div class="panel-body compact-kv"><div><span>网络维度</span><span>16</span></div><div><span>alpha</span><span>8</span></div><div><span>训练步数</span><span>2400</span></div><div><span>训练分辨率</span><span>1024</span></div></div></section></aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260614-prototype-alignment-2"></script>
    <script>initLoraPrototype("templates");</script>
  </body>
</html>
