<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 新建项目</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260614-prototype-alignment-2" />
  </head>
  <body>
    <a class="skip-link" href="#prototype-main">跳到主要内容</a>
    <main class="app-shell" id="prototype-main">
      <div class="page">
        <header class="topbar">
          <div class="title-stack">
            <a class="back-link" href="./manager-lora-training-projects-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回项目</a>
            <div class="title-row">
              <h1>新建项目</h1>
              <span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="button" type="button">保存草稿</button>
            <button class="button primary" type="button">创建项目</button>
          </div>
        </header>

        <section class="layout wide-left">
          <div class="stack">
            <section class="panel">
              <div class="panel-header">
                <h2>基础</h2>
                <span class="status-note amber">未创建</span>
              </div>
              <div class="panel-body form-grid">
                <div class="field full">
                  <label>名称</label>
                  <input class="input" name="project_name" aria-label="项目名称" autocomplete="off" value="Vela Neon Jacket" />
                </div>
                <div class="field full">
                  <label>图片提示词指引</label>
                  <textarea class="textarea" name="image_prompt_guidance" aria-label="图片提示词指引" autocomplete="off" spellcheck="false">把角色细节文本作为身份锚点。每次生成 1 张干净、可训练、背景清晰的人物图片。</textarea>
                </div>
                <div class="field full">
                  <label>caption 生成指引</label>
                  <textarea class="textarea" name="training_caption_format" aria-label="caption 生成指引" autocomplete="off" spellcheck="false">先写 LoRA 触发提示词，再用一段简洁描述补充服装、姿态、光线、镜头构图和背景。</textarea>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <h2>角色资料</h2>
                <button class="button" type="button"><i data-lucide="sparkles" aria-hidden="true"></i> 生成资料</button>
              </div>
              <div class="panel-body form-grid">
                <div class="field full">
                  <label>LoRA 触发提示词</label>
                  <textarea class="textarea" name="profile_lora_usage_prompt" aria-label="LoRA 触发提示词" autocomplete="off" spellcheck="false">vela_neon_jacket, silver-black short hair, cool blue eyes, sleek cyan jacket</textarea>
                </div>
                <div class="field full">
                  <label>角色细节文本</label>
                  <textarea class="textarea" name="profile_character_detail_prompt" aria-label="角色细节文本" autocomplete="off" spellcheck="false">银黑色短发，冷调蓝眼，黑青色短夹克，正面站姿，表情平静自信，人物剪影干净，无文字水印。</textarea>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <h2>初始小节</h2>
                <button class="button" type="button"><i data-lucide="plus" aria-hidden="true"></i> 添加小节</button>
              </div>
              <div class="panel-body block-list">
                <div class="block-item">
                  <span class="block-index">1</span>
                  <div class="row-title"><strong>舞台灯光</strong><span>来自光线分类预制 · 青色轮廓光</span></div>
                  <span class="chip green">启用</span>
                </div>
                <div class="block-item">
                  <span class="block-index">2</span>
                  <div class="row-title"><strong>街角夜景</strong><span>来自环境分类预制 · 潮湿霓虹街道</span></div>
                  <span class="chip green">启用</span>
                </div>
              </div>
            </section>
          </div>

          <aside class="stack">
            <section class="panel">
              <div class="panel-header"><h2>选择模板</h2></div>
              <div class="panel-body stack">
                <div class="list-row">
                  <div class="row-head">
                    <div class="row-title"><strong>角色 LoRA 基础模板</strong><span>6 个小节 · 4 类场景预制</span></div>
                    <span class="status-note blue">已选</span>
                  </div>
                </div>
                <div class="list-row subtle">
                  <div class="plain-meta"><span>已复制模板规则</span><span>后续项目内编辑不会回写模板</span></div>
                </div>
                <div class="list-row">
                  <div class="row-title"><strong>写实头像模板</strong><span>4 个小节 · 轻量 caption 指引</span></div>
                  <div class="action-strip"><a class="button" href="./manager-lora-training-template-edit-prototype.html?template=portrait"><i data-lucide="eye" aria-hidden="true"></i>预览模板</a><button class="button" type="button"><i data-lucide="check" aria-hidden="true"></i>改选此模板</button></div>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header"><h2>参考图</h2></div>
              <div class="panel-body reference-grid">
                <article class="media-card">
                  <button class="image-card-img" type="button" data-lightbox-src="./assets/images/lora-training-generation-result-output.png" data-lightbox-caption="主参考图 · 正面半身">
                    <img src="./assets/images/lora-training-generation-result-thumb.png" width="300" height="400" loading="lazy" alt="训练图片缩略图" />
                  </button>
                  <div class="media-body"><strong class="small">主参考图</strong><span class="tiny muted">正面半身</span></div>
                </article>
                <article class="media-card">
                  <button class="image-card-img" type="button" data-lightbox-src="./assets/images/lora-training-generation-result-output.png" data-lightbox-caption="辅助参考图 · 外套细节">
                    <img src="./assets/images/lora-training-generation-result-thumb.png" width="300" height="400" loading="lazy" alt="训练图片缩略图" />
                  </button>
                  <div class="media-body"><strong class="small">辅助参考图</strong><span class="tiny muted">外套细节</span></div>
                </article>
              </div>
            </section>
          </aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260614-prototype-alignment-2"></script>
    <script>initLoraPrototype("projects");</script>
  </body>
</html>
