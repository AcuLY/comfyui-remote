<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>LoRA 训练模式 - 新建项目原型</title>
    <link rel="stylesheet" href="./assets/lora-training-shared.css?v=20260611-lora-rewrite-2" />
  </head>
  <body>
    <main class="app-shell">
      <div class="page">
        <header class="topbar">
          <div class="title-stack">
            <a class="back-link" href="./manager-lora-training-projects-prototype.html"><i data-lucide="arrow-left" aria-hidden="true"></i> 返回项目</a>
            <div class="title-row">
              <h1>新建项目</h1>
              <span class="mode-pill"><i data-lucide="flask-conical" aria-hidden="true"></i> LoRA 训练</span>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="button" type="button">保存草稿</button>
            <button class="button primary" type="button">创建项目</button>
          </div>
        </header>

        <section class="layout wide-left">
          <div class="stack">
            <section class="panel">
              <div class="panel-header">
                <h2>基础</h2>
                <span class="status-note amber">未创建</span>
              </div>
              <div class="panel-body form-grid">
                <div class="field">
                  <label>名称</label>
                  <input class="input" value="Vela Neon Jacket" />
                </div>
                <div class="field">
                  <label>slug</label>
                  <input class="input" value="vela-neon-jacket" />
                </div>
                <div class="field full">
                  <label>图片 Prompt 指引</label>
                  <textarea class="textarea">Use the character detail prompt as identity guidance. Generate one clean training image for LoRA dataset use.</textarea>
                </div>
                <div class="field full">
                  <label>训练 caption 格式</label>
                  <textarea class="textarea">Begin with the LoRA usage prompt, then describe clothing, pose, lighting, camera framing, and background in one concise paragraph.</textarea>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <h2>角色资料</h2>
                <button class="button" type="button"><i data-lucide="sparkles" aria-hidden="true"></i> 生成资料</button>
              </div>
              <div class="panel-body form-grid">
                <div class="field full">
                  <label>LoRA 触发提示词</label>
                  <textarea class="textarea">vela_neon_jacket, silver-black short hair, cool blue eyes, sleek cyan jacket</textarea>
                </div>
                <div class="field full">
                  <label>角色细节文本</label>
                  <textarea class="textarea">A calm front-facing young woman with silver-black short hair, cool blue eyes, glossy black and teal cropped jacket, clean silhouette, no text or watermark.</textarea>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header">
                <h2>初始小节</h2>
                <button class="button" type="button"><i data-lucide="plus" aria-hidden="true"></i> 添加小节</button>
              </div>
              <div class="panel-body block-list">
                <div class="block-item">
                  <span class="block-index">1</span>
                  <div class="row-title"><strong>舞台灯光</strong><span>category: lighting · preset: cyan rim light</span></div>
                  <span class="chip green">启用</span>
                </div>
                <div class="block-item">
                  <span class="block-index">2</span>
                  <div class="row-title"><strong>街角夜景</strong><span>category: environment · preset: wet neon street</span></div>
                  <span class="chip green">启用</span>
                </div>
              </div>
            </section>
          </div>

          <aside class="stack">
            <section class="panel">
              <div class="panel-header"><h2>模板</h2></div>
              <div class="panel-body stack">
                <a class="list-row" href="./manager-lora-training-template-edit-prototype.html">
                  <div class="row-head">
                    <div class="row-title"><strong>角色 LoRA 基础模板</strong><span>6 个小节 · 4 类 scene preset</span></div>
                    <span class="status-note blue">选中</span>
                  </div>
                </a>
                <div class="list-row">
                  <div class="row-title"><strong>写实头像模板</strong><span>4 个小节 · 轻量 caption format</span></div>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="panel-header"><h2>参考图</h2></div>
              <div class="panel-body reference-grid">
                <article class="media-card">
                  <button class="image-card-img" type="button" data-lightbox-src="./assets/images/lora-training-generation-result-output.png" data-lightbox-caption="original_reference · 正面半身">
                    <img src="./assets/images/lora-training-generation-result-thumb.png" width="300" height="400" loading="lazy" alt="训练图片缩略图" />
                  </button>
                  <div class="media-body"><strong class="small">original_reference</strong><span class="tiny muted">正面半身</span></div>
                </article>
                <article class="media-card">
                  <button class="image-card-img" type="button" data-lightbox-src="./assets/images/lora-training-generation-result-output.png" data-lightbox-caption="auxiliary_reference · 外套细节">
                    <img src="./assets/images/lora-training-generation-result-thumb.png" width="300" height="400" loading="lazy" alt="训练图片缩略图" />
                  </button>
                  <div class="media-body"><strong class="small">auxiliary_reference</strong><span class="tiny muted">外套细节</span></div>
                </article>
              </div>
            </section>
          </aside>
        </section>
      </div>
    </main>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./assets/lora-training-shared.js?v=20260611-lora-rewrite-2"></script>
    <script>initLoraPrototype("projects");</script>
  </body>
</html>
